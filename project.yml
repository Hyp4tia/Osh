name: Osh
options:
  bundleIdPrefix: com.zeyadistired
  deploymentTarget:
    macOS: "11.0"
settings:
  MARKETING_VERSION: ${MARKETING_VERSION}
  CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1
targets:
  Osh:
    type: application
    platform: macOS
    sources: 
      - Sources/OshApp
      - Sources/Shared
      - path: web-renderer/dist
        name: WebRenderer
        type: folder
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: "Osh"
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadistired.osh
        INFOPLIST_FILE: Sources/OshApp/Info.plist
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        ENABLE_PREVIEWS: NO
        MARKETING_VERSION: ${MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/OshApp/Osh.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/OshApp/OshRelease.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - target: OshQuickLook
        embed: true
      - package: Sparkle
        product: Sparkle

  OshQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - Sources/OshQuickLook
      - Sources/Shared
      - path: web-renderer/dist
        name: WebRenderer
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyadistired.osh.QuickLook
        INFOPLIST_FILE: Sources/OshQuickLook/Info.plist
        SKIP_INSTALL: YES
        MARKETING_VERSION: ${MARKETING_VERSION}
        CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/OshQuickLook/OshQuickLook.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/OshQuickLook/OshQuickLookRelease.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - sdk: QuickLookUI.framework

  OshTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/OshTests
      - Sources/OshApp/WindowAccessor.swift
      - Sources/OshApp/ResourceLoader.swift
      - Sources/OshApp/EditingSessionController.swift
      - Sources/OshApp/SourceEditorView.swift
      - Sources/OshApp/MarkdownDocument.swift
      - Sources/OshQuickLook
      - Sources/Shared
      - benchmark/swift-bench/RenderBenchmarkTests.swift
      - path: web-renderer/dist
        name: WebRenderer
        type: folder
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.zeyadistired.osh.Tests
      MARKETING_VERSION: ${MARKETING_VERSION}
      CURRENT_PROJECT_VERSION: ${CURRENT_PROJECT_VERSION}
schemes:
  Osh:
    build:
      targets:
        Osh: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: OshTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
