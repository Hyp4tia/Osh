name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.language == 'swift' && 120 || 360 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (Swift)
        if: matrix.language == 'swift'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-renderer/package-lock.json

      - name: Install xcodegen (Swift)
        if: matrix.language == 'swift'
        run: brew install xcodegen

      - name: Build web renderer (Swift)
        if: matrix.language == 'swift'
        working-directory: web-renderer
        run: |
          npm ci
          npm run build

      - name: Generate Xcode project (Swift)
        if: matrix.language == 'swift'
        run: |
          rm -rf Osh.xcodeproj
          FULL_V="$(cat .version 2>/dev/null || echo "1.0.0")"
          BUILD="$(echo "$FULL_V" | cut -d'.' -f3)"
          BUILD="${BUILD:-1}"
          MARKETING_VERSION="$FULL_V" CURRENT_PROJECT_VERSION="$BUILD" xcodegen generate --quiet

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Osh for CodeQL Tracing (Swift)
        if: matrix.build-mode == 'manual'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          xcodebuild build \
            -project Osh.xcodeproj \
            -scheme Osh \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
